{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giver</title>
    <link rel="stylesheet" href="{% static 'css/index.css'%}">
</head>
<body>
    <div>
        <form method="post">
            {% csrf_token %}
            <input type="text"placeholder='Movie title' name="title" required><br>
            <button type="submit">Search</button>
        </form>
    </div>

    <div id="movie_posters">
        {% if movies%}
            {% for movie in movies %}   
                {% if movie.path %}
                    <a href="{% url 'movie_detail' movie_id=movie.id %}"><img src="{{movie.path}}" alt="{{movie.title}}" width="300px"></a>

                {% endif %}
            {% endfor %}

        {% else %}
            <p>An an error occurred while fetching the data</p>
        
        {% endif %}


    </div>


    <div id="recommendation"></div>
</body>
</html>
