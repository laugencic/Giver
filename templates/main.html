{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Giver{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/main.css'%}">
</head>

<body>
    <nav class="navbar">
        <a href="{% url 'home' %}" class="brand">
        </a>

        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'register' %}" class="register-link">
                Register
            </a>
            <a href="{% url 'profile' %}">Profile</a>
        </div>
    </nav>

    <main>
        {% block body %}
        {% endblock %}
    </main>
    
    <script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);

            if (!input) return;

            const isHidden = input.type === "password";

            input.type = isHidden ? "text" : "password";

            button.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );

            button.setAttribute(
                "aria-pressed",
                String(isHidden)
            );

            // Change the eye icon to a crossed-out eye when visible.
            button.innerHTML = isHidden
                ? `<svg viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="M3 3l18 18"/>
                    <path d="M10.6 10.6a2 2 0 002.8 2.8"/>
                    <path d="M9.9 5.2A10.8 10.8 0 0112 5
                        c6.4 0 10 7 10 7a15.8 15.8 0 01-3.1 3.9"/>
                    <path d="M6.2 6.2C3.5 8 2 12 2 12
                        s3.6 7 10 7a10 10 0 004-.8"/>
                </svg>`
                : `<svg viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round"
                    aria-hidden="true">
                    <path d="M2 12s3.6-7 10-7 10 7 10 7
                        -3.6 7-10 7-10-7-10-7Z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>`;
        }
    </script>
</body>
</html>

</body>
</html>
